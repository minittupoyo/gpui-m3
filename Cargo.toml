[package]
name = "gpui-m3"
version = "0.1.0"
edition = "2024"
description = "Material Design 3 (Expressive) components for GPUI"
authors = ["minittupoyo"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gpui", "material-design", "material3", "ui", "gui"]
categories = ["gui"]
# gpui は crates.io に無く git 依存のため、crates.io には公開できない
publish = false

[lib]
name = "gpui_m3"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
anyhow = "1"
unicode-segmentation = "1"
material-colors = "0.5"

[dev-dependencies]
# examples（ギャラリーなど）の起動にだけ使う
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit", "wayland", "x11"] }
